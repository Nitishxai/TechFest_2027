
<!DOCTYPE html>
<html>
<head>
    <title>TechFest 2027 - Registration</title>
</head>
<body>

    <header>
        <h1>TechFest 2027 Registration</h1>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="events.html">Events</a> |
        <a href="schedule.html">Schedule</a> |
        <a href="register.html">Registration</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <hr>

    <main>
        <section>
            <h2>Student Registration Form</h2>

            <form>

                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" required>
                <br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone"
                    pattern="[0-9]{10}" required>
                <br><br>

                <label for="department">Department:</label><br>

                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="cse">Computer Science</option>
                    <option value="aiml">AI and Machine Learning</option>
                    <option value="it">Information Technology</option>
                    <option value="management">Management</option>
                    <option value="other">Other</option>
                </select>

                <br><br>

                <label>Year of Study:</label><br>

                <input type="radio" name="year" value="1" required>
                First Year<br>

                <input type="radio" name="year" value="2">
                Second Year<br>

                <input type="radio" name="year" value="3">
                Third Year<br>

                <input type="radio" name="year" value="4">
                Fourth Year<br><br>

                <label>Select Events:</label><br>

                <input type="checkbox" name="event" value="coding">
                Coding Competition<br>

                <input type="checkbox" name="event" value="quiz">
                Technical Quiz<br>

                <input type="checkbox" name="event" value="hackathon">
                Hackathon<br>

                <input type="checkbox" name="event" value="poster">
                Poster Making<br>

                <input type="checkbox" name="event" value="gaming">
                Gaming Competition<br><br>

                <label for="message">Additional Information:</label><br>

                <textarea id="message" name="message"
                    rows="5" cols="40">
                </textarea>

                <br><br>

                <input type="submit" value="Register">
                <input type="reset" value="Clear Form">

            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>@2027 TechFest</p>
    </footer>

</body>
</html>
